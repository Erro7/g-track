name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（如 v1.0.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: app/android
        run: chmod +x ./gradlew

      - name: Assemble release APK
        working-directory: app/android
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK with version
        working-directory: app/android
        run: |
          VERSION=$(grep -m1 -oE 'versionName = "[^"]+"' app/build.gradle.kts | grep -oE '[0-9]+(\.[0-9]+)*')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # 未配置签名时产物名为 app-release-unsigned.apk，签名后为 app-release.apk，这里兼容两者
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "app/build/outputs/apk/release/GTRACK-v${VERSION}.apk"
          rm -f app/build/outputs/apk/release/app-release*.apk

      # 注意：当前构建未配置签名（assembleRelease 产出未签名 APK）。
      # 如需上架签名版，在仓库 Secrets 里放 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD，
      # 并在 app/build.gradle.kts 增加对应的 signingConfig。
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: GTRACK v${{ env.VERSION }}
          generate_release_notes: true
          files: app/android/app/build/outputs/apk/release/GTRACK-v*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
